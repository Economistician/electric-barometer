######################################
# Project metadata
######################################
[project]
name = "electric-barometer"
version = "0.2.9"
description = "Umbrella package for the Electric Barometer ecosystem (metrics, evaluation, features, adapters, and related tooling)."
readme = "README.md"
requires-python = ">=3.11"

# License expression string (PEP 639-compatible)
license = "BSD-3-Clause"
license-files = ["LICENSE*"]

authors = [
  { name = "Kyle Corrie (Economistician)", email = "kcorrie@economistician.com" }
]

keywords = ["forecasting", "operations", "evaluation", "metrics", "features", "time-series"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

######################################
# Core runtime dependencies
######################################
# Electric Barometer System Release 0.2.9 pins
dependencies = [
  "eb-metrics==0.2.8",
  "eb-evaluation==0.2.9",
  "eb-adapters==0.2.4",
  "eb-features==0.2.6",
  "eb-contracts==0.2.2",
  "eb-optimization==0.2.7",
]

######################################
# Project URLs
######################################
[project.urls]
Homepage = "https://github.com/Economistician/electric-barometer"
Repository = "https://github.com/Economistician/electric-barometer"
Issues = "https://github.com/Economistician/electric-barometer/issues"
Documentation = "https://economistician.github.io/eb-docs/"

######################################
# Optional dependencies (extras)
######################################
[project.optional-dependencies]

# CI / test-only dependencies
test = [
  "pytest>=8.0",
]

# Local developer tooling
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

# Ecosystem extras (exact System Release 0.2.9 pins)
metrics = [
  "eb-metrics==0.2.8",
]
evaluation = [
  "eb-evaluation==0.2.9",
]
adapters = [
  "eb-adapters==0.2.4",
]
features = [
  "eb-features==0.2.6",
]
contracts = [
  "eb-contracts==0.2.2",
]
optimization = [
  "eb-optimization==0.2.7",
]

# Proxy extras to eb-metrics extras
sklearn = [
  "eb-metrics[sklearn]==0.2.8",
]
tf = [
  "eb-metrics[tf]==0.2.8",
]

# Convenience rollups
# IMPORTANT: do NOT self-reference "electric-barometer[...]" inside its own extras.
all = [
  "eb-metrics[sklearn,tf]==0.2.8",
  "eb-evaluation==0.2.9",
  "eb-adapters==0.2.4",
  "eb-features==0.2.6",
  "eb-contracts==0.2.2",
  "eb-optimization==0.2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

######################################
# Build system
######################################
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

######################################
# Package discovery
######################################
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
electric_barometer = ["py.typed"]

######################################
# Pytest configuration
######################################
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
